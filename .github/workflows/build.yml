name: CMake CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
          - os: windows-latest
            build_type: Release
          - os: macos-latest
            build_type: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sdl3:
    name: SDL3 frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl-dev libgl-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev libdecor-0-dev
      - name: Install SDL3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch release-3.2.28 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          cmake --build sdl-build --config Release --parallel
          cmake --install sdl-build --config Release --prefix "${{ github.workspace }}/sdl-install"
      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3
      - name: Install SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch release-3.2.28 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          cmake --build sdl-build --config Release --parallel
          cmake --install sdl-build --config Release --prefix "${{ github.workspace }}/sdl-install"
      - name: Configure SDL3 frontend (Windows/Linux)
        if: runner.os != 'macOS'
        run: cmake -S . -B build-sdl -DCA_MAME_ENABLE_SDL3=ON -DCMAKE_PREFIX_PATH="${{ github.workspace }}/sdl-install" -DCMAKE_BUILD_TYPE=Release
      - name: Configure SDL3 frontend (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build-sdl -DCA_MAME_ENABLE_SDL3=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build SDL3 frontend
        run: cmake --build build-sdl --config Release --parallel
      - name: Run headless tests
        run: ctest --test-dir build-sdl -C Release --output-on-failure
      - name: Package Windows SDL3 executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist/CA-MAME-Windows | Out-Null
          $exe = Get-ChildItem -Path build-sdl -Recurse -Filter ca-mame-sdl.exe | Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $exe) { throw 'ca-mame-sdl.exe not found' }
          Copy-Item $exe.FullName dist/CA-MAME-Windows/
          $gun = Get-ChildItem -Path build-sdl -Recurse -Filter ca-mame-gun-test.exe | Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $gun) { throw 'ca-mame-gun-test.exe not found' }
          Copy-Item $gun.FullName dist/CA-MAME-Windows/
          $library = Get-ChildItem -Path build-sdl -Recurse -Filter ca-mame-library.exe | Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $library) { throw 'ca-mame-library.exe not found' }
          Copy-Item $library.FullName dist/CA-MAME-Windows/
          Copy-Item packaging/windows/Start-CA-MAME.ps1 dist/CA-MAME-Windows/
          @'
          @echo off
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Start-CA-MAME.ps1" %*
          pause
          '@ | Set-Content -Path dist/CA-MAME-Windows/Start-CA-MAME.cmd
          foreach ($category in @('snap','titles','cabinets')) {
            $folder = "dist/CA-MAME-Windows/roms/artwork/$category"
            New-Item -ItemType Directory -Force -Path $folder | Out-Null
            'Place your own artwork here.' | Set-Content -Path "$folder/README.txt"
          }
          $imageDll = Get-ChildItem -Path build-sdl -Recurse -Filter SDL3_image.dll | Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $imageDll) { throw 'SDL3_image.dll not found' }
          Copy-Item $imageDll.FullName dist/CA-MAME-Windows/
          $dll = Get-ChildItem -Path sdl-install -Recurse -Filter SDL3.dll | Select-Object -First 1
          if (-not $dll) { throw 'SDL3.dll not found' }
          Copy-Item $dll.FullName dist/CA-MAME-Windows/
          @'
          CA-MAME Arcade Emulator - Windows
          =================================
          Run Start-CA-MAME.cmd to open the game library.
          Install MAME separately and place mame.exe alongside this launcher, or
          pass -MameExecutable "C:\path\to\mame.exe" to Start-CA-MAME.ps1.
          The launcher creates catalog.xml using MAME -listxml on first run.
          Add legally obtained game archives to the roms directory.
          The game library launches games through external MAME.
          To test mouse aiming without ROMs, run ca-mame-gun-test.exe.
          Left click = fire, right click = reload, Escape = quit.
          To launch Space Invaders, place legally obtained invaders.h, invaders.g, invaders.f, invaders.e ROMs in this folder.
          Run from a terminal:
            .\\ca-mame-sdl.exe invaders.h invaders.g invaders.f invaders.e
          C = coin, 1/2 = start, arrows = move, Space = fire, Esc = quit.
          This is an experimental emulator; actual game execution is not yet validated.
          '@ | Set-Content -Path dist/CA-MAME-Windows/README.txt
          Compress-Archive -Path dist/CA-MAME-Windows/* -DestinationPath dist/CA-MAME-Windows.zip -Force
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CA-MAME-Windows-SDL3
          path: dist/CA-MAME-Windows.zip
          if-no-files-found: error
          retention-days: 30
