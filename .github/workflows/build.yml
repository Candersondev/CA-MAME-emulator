name: CMake CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
          - os: windows-latest
            build_type: Release
          - os: macos-latest
            build_type: Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  sdl3:
    name: SDL3 frontend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl-dev libgl-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev libdecor-0-dev
      - name: Install SDL3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone --depth 1 --branch release-3.2.28 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          cmake --build sdl-build --config Release --parallel
          cmake --install sdl-build --config Release --prefix "${{ github.workspace }}/sdl-install"
      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3
      - name: Install SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch release-3.2.28 https://github.com/libsdl-org/SDL.git sdl-src
          cmake -S sdl-src -B sdl-build -DCMAKE_BUILD_TYPE=Release -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          cmake --build sdl-build --config Release --parallel
          cmake --install sdl-build --config Release --prefix "${{ github.workspace }}/sdl-install"
      - name: Configure SDL3 frontend (Windows/Linux)
        if: runner.os != 'macOS'
        run: cmake -S . -B build-sdl -DCA_MAME_ENABLE_SDL3=ON -DCMAKE_PREFIX_PATH="${{ github.workspace }}/sdl-install" -DCMAKE_BUILD_TYPE=Release
      - name: Configure SDL3 frontend (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build-sdl -DCA_MAME_ENABLE_SDL3=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build SDL3 frontend
        run: cmake --build build-sdl --config Release --parallel
      - name: Run headless tests
        run: ctest --test-dir build-sdl -C Release --output-on-failure
